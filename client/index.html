<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коты Воители 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #111;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
        #login-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #login-screen input, #login-screen select, #login-screen button {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        #login-screen button {
            background: #2e8b57;
            color: white;
            cursor: pointer;
        }
        #login-screen button:hover {
            background: #3cb371;
        }
    </style>
</head>
<body>

    <!-- Меню входа в игру -->
    <div id="login-screen">
        <h1>Коты Воители: Онлайн 3D</h1>
        <input type="text" id="cat-name" placeholder="Имя твоего кота" value="Огнегрив" maxlength="12">
        <select id="cat-tribe">
            <option value="Грозовое">Грозовое племя</option>
            <option value="Речное">Речное племя</option>
            <option value="Племя Теней">Племя Теней</option>
            <option value="Племя Ветра">Племя Ветра</option>
        </select>
        <input type="color" id="cat-color" value="#e36414" style="width: 100px; height: 40px; cursor: pointer;">
        <button id="start-btn">Войти в лесные угодья</button>
    </div>

    <!-- Интерфейс в игре -->
    <div id="ui">
        <h3 id="info-tribe" style="margin:0 0 5px 0;">Племя: -</h3>
        <p style="margin:0;">Управление: W, A, S, D для бега</p>
    </div>

    <!-- Подключаем Three.js и Socket.io из надежных CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
        let socket;
        let scene, camera, renderer;
        let myCat;
        let otherPlayers = {};
        let keys = { w: false, a: false, s: false, d: false };

        document.getElementById('start-btn').addEventListener('click', () => {
            const name = document.getElementById('cat-name').value.trim();
            const tribe = document.getElementById('cat-tribe').value;
            const color = document.getElementById('cat-color').value;

            if (!name) {
                alert('Введи имя кота!');
                return;
            }

            // Убираем экран входа
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('info-tribe').innerText = `Племя: ${tribe} | Кот: ${name}`;

            initGame(name, tribe, color);
        });

        function initGame(name, tribe, colorHex) {
            // 1. Инициализация Three.js сцены
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Небесно-голубой цвет

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(20, 40, 20);
            scene.add(directionalLight);

            // Земля (Лесная поляна)
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Создаем модель нашего кота (простая сборка из примитивов: тело, голова, ушки)
            myCat = createCatMesh(colorHex);
            scene.add(myCat);

            // 2. Подключение к серверу (укажи адрес своего сервера на Render или оставь localhost для тестов)
            // Когда задеплоишь сервер на Render, замени 'http://localhost:3000' на 'https:// твой-сервер.onrender.com'
            const SERVER_URL = 'http://localhost:3000'; 
            socket = io(SERVER_URL);

            socket.on('connect', () => {
                console.log('Подключено к серверу племён!');
                socket.emit('join_game', { name, tribe, color: colorHex });
            });

            // Получение списка текущих игроков
            socket.on('current_players', (players) => {
                for (let id in players) {
                    if (id !== socket.id) {
                        addOtherPlayer(players[id]);
                    }
                }
            });

            // Появление нового игрока
            socket.on('new_player', (playerData) => {
                addOtherPlayer(playerData);
            });

            // Перемещение другого игрока
            socket.on('player_moved', (playerData) => {
                if (otherPlayers[playerData.id]) {
                    let p = otherPlayers[playerData.id];
                    p.mesh.position.set(playerData.x, playerData.y, playerData.z);
                    p.mesh.rotation.y = playerData.rotation;
                }
            });

            // Выход игрока
            socket.on('player_disconnected', (id) => {
                if (otherPlayers[id]) {
                    scene.remove(otherPlayers[id].mesh);
                    delete otherPlayers[id];
                }
            });

            // Управление с клавиатуры
            window.addEventListener('keydown', (e) => updateKeys(e, true));
            window.addEventListener('keyup', (e) => updateKeys(e, false));

            // Изменение размера окна
            window.addEventListener('resize', onWindowResize);

            // Игровой цикл
            animate();
        }

        // Функция сборки 3D-кота из геометрических фигур
        function createCatMesh(colorHex) {
            const catGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: colorHex });

            // Тело
            const bodyGeo = new THREE.BoxGeometry(0.8, 0.6, 1.4);
            const body = new THREE.Mesh(bodyGeo, mat);
            body.position.y = 0.5;
            catGroup.add(body);

            // Голова
            const headGeo = new THREE.BoxGeometry(0.7, 0.6, 0.7);
            const head = new THREE.Mesh(headGeo, mat);
            head.position.set(0, 0.9, 0.7);
            catGroup.add(head);

            // Ушки
            const earGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
            const earLeft = new THREE.Mesh(earGeo, mat);
            earLeft.position.set(0.25, 1.3, 0.7);
            catGroup.add(earLeft);

            const earRight = new THREE.Mesh(earGeo, mat);
            earRight.position.set(-0.25, 1.3, 0.7);
            catGroup.add(earRight);

            // Хвост
            const tailGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.0);
            const tail = new THREE.Mesh(tailGeo, mat);
            tail.rotation.x = Math.PI / 3;
            tail.position.set(0, 0.8, -0.9);
            catGroup.add(tail);

            return catGroup;
        }

        function addOtherPlayer(playerData) {
            const mesh = createCatMesh(playerData.color);
            mesh.position.set(playerData.x, playerData.y, playerData.z);
            scene.add(mesh);
            otherPlayers[playerData.id] = { mesh: mesh };
        }

        function updateKeys(e, isDown) {
            if (e.key === 'w' || e.key === 'W') keys.w = isDown;
            if (e.key === 'a' || e.key === 'A') keys.a = isDown;
            if (e.key === 's' || e.key === 'S') keys.s = isDown;
            if (e.key === 'd' || e.key === 'D') keys.d = isDown;
        }

        const speed = 0.15;
        let posX = 0, posZ = 0, rotationY = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Логика движения нашего кота
            let moved = false;
            if (keys.w) { posX += Math.sin(rotationY) * speed; posZ += Math.cos(rotationY) * speed; moved = true; }
            if (keys.s) { posX -= Math.sin(rotationY) * speed; posZ -= Math.cos(rotationY) * speed; moved = true; }
            if (keys.a) { rotationY += 0.05; }
            if (keys.d) { rotationY -= 0.05; }

            if (myCat) {
                myCat.position.set(posX, 0.5, posZ);
                myCat.rotation.y = rotationY;

                // Камера следует за котом (вид сзади-сверху)
                camera.position.x = posX - Math.sin(rotationY) * 6;
                camera.position.y = 4;
                camera.position.z = posZ - Math.cos(rotationY) * 6;
                camera.lookAt(posX, 1, posZ);

                // Отправляем координаты на сервер, если кот двигался
                if (moved && socket && socket.connected) {
                    socket.emit('player_move', { x: posX, y: 0.5, z: posZ, rotation: rotationY });
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
