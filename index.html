<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космическая Дуэль - Supabase Multiplayer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #login-screen {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
            z-index: 10;
        }
        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            margin-bottom: 15px;
            width: 220px;
            outline: none;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #4f46e5; }
        canvas {
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            display: none;
        }
        #ui {
            display: none;
            position: absolute;
            top: 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Подключаем клиент Supabase -->
    <script src="https://cdn.jsdelivr.com/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="login-screen">
        <h2>Космическая Дуэль</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Введите имя и позовите подругу!</p>
        <input type="text" id="username" placeholder="Ваше имя..." maxlength="12"><br>
        <button id="join-btn">Войти в космос</button>
    </div>

    <div id="ui">Очки: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    // СЮДА ВСТАВЛЯЙ СВОИ ДАННЫЕ ИЗ SUPABASE:
    const SUPABASE_URL = 'https://rytfzqktytcjsytkxrqn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_31LjSxs-D3hhNVnFFNTAhA_NKeQhXKk';

    let supabaseClient = null;
    try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {
        console.error("Ошибка инициализации Supabase. Проверь ключи!");
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let myName = '';
    let myId = 'player_' + Math.random().toString(36).substring(2, 9);
    let myScore = 0;
    
    const keys = {};
    let myX = 400, myY = 300;
    const speed = 4;
    
    let players = {};
    let stars = [];

    // Генерируем фоновые звезды
    for(let i = 0; i < 50; i++) {
        stars.push({x: Math.random() * 800, y: Math.random() * 600, size: Math.random() * 2});
    }

    document.getElementById('join-btn').onclick = () => {
        const val = document.getElementById('username').value.trim();
        if(!val) return alert('Введите имя!');
        myName = val;
        
        if (SUPABASE_URL.includes('YOUR_')) {
            alert('Внимание! Забыла заменить ключи Supabase в коде!');
        }

        document.getElementById('login-screen').style.display = 'none';
        canvas.style.display = 'block';
        document.getElementById('ui').style.display = 'block';

        initMultiplayer();
        loop();
    };

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function initMultiplayer() {
        if (!supabaseClient) return;

        const channel = supabaseClient.channel('space_game_room');

        channel
            .on('broadcast', { event: 'state' }, payload => {
                if (payload.payload.id !== myId) {
                    players[payload.payload.id] = payload.payload;
                }
            })
            .subscribe();

        // Каждые 50мс отправляем свои координаты
        setInterval(() => {
            if (!myName) return;
            channel.send({
                type: 'broadcast',
                event: 'state',
                payload: { id: myId, name: myName, x: myX, y: myY, score: myScore }
            });
        }, 50);
    }

    function update() {
        if (keys['ArrowLeft'] || keys['KeyA']) myX -= speed;
        if (keys['ArrowRight'] || keys['KeyD']) myX += speed;
        if (keys['ArrowUp'] || keys['KeyW']) myY -= speed;
        if (keys['ArrowDown'] || keys['KeyS']) myY += speed;

        // Границы экрана
        myX = Math.max(20, Math.min(780, myX));
        myY = Math.max(20, Math.min(580, myY));
    }

    function draw() {
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Звезды
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => {
            ctx.globalAlpha = Math.random() * 0.7 + 0.3;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        ctx.globalAlpha = 1.0;

        // Рисуем себя
        drawShip(myX, myY, myName, '#6366f1');

        // Рисуем остальных игроков
        for (let id in players) {
            let p = players[id];
            drawShip(p.x, p.y, p.name, '#ec4899');
        }
    }

    function drawShip(x, y, name, color) {
        ctx.save();
        ctx.translate(x, y);
        
        // Корпус корабля
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -15);
        ctx.lineTo(12, 12);
        ctx.lineTo(-12, 12);
        ctx.closePath();
        ctx.fill();

        // Огонек двигателя
        ctx.fillStyle = '#f97316';
        ctx.fillRect(-4, 12, 8, 6);

        // Имя игрока
        ctx.fillStyle = '#ffffff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(name, 0, -22);

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
