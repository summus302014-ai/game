<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSpace App</title>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* === SOFT NEON FULL DESIGN === */
    :root {
      --bg-color: #0b0d14;
      --card-bg: rgba(22, 27, 46, 0.75);
      --border-neon: rgba(168, 85, 247, 0.35);
      --accent-purple: #a855f7;
      --accent-pink: #f43f5e;
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-dim: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* === ЭКРАН АВТОРИЗАЦИИ === */
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(168, 85, 247, 0.18) 0%, rgba(11, 13, 20, 0.95) 70%);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .auth-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .secondary-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border-neon);
      color: var(--text-main);
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .secondary-btn:hover {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.1);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
    }

    .error-msg {
      color: var(--accent-pink);
      font-size: 13px;
      margin-top: 12px;
    }

    /* === ГЛАВНЫЙ ИНТЕРФЕЙС === */
    .app-container {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-neon);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      box-shadow: 5px 0 25px rgba(168, 85, 247, 0.05);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      text-shadow: 0 0 12px var(--accent-purple);
      margin-bottom: 24px;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      padding: 12px 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      color: #fff;
      background: rgba(168, 85, 247, 0.1);
      border-color: rgba(168, 85, 247, 0.2);
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--accent-pink);
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(244, 63, 94, 0.15);
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.3);
    }

    .main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    /* === НЕОНОВЫЕ ЭЛЕМЕНТЫ === */
    .neon-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-neon);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .neon-input {
      width: 100%;
      background: rgba(11, 13, 20, 0.7);
      border: 1px solid var(--border-neon);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      outline: none;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .neon-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
    }

    .action-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.35);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.6);
    }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: ВХОД / РЕГИСТРАЦИЯ -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-card neon-card">
      <h1 class="logo">NEON // HUB</h1>
      <p class="subtitle">Войдите в систему для доступа к сети</p>

      <form id="auth-form" onsubmit="handleAuth(event)">
        <input type="email" id="auth-email" class="neon-input" placeholder="Ваш Email" required>
        <input type="password" id="auth-password" class="neon-input" placeholder="Пароль" required>
        
        <div class="auth-actions">
          <button type="submit" class="action-btn" id="login-btn">Войти</button>
          <button type="button" class="secondary-btn" onclick="handleSignUp()">Регистрация</button>
        </div>
      </form>
      <div id="auth-error" class="error-msg"></div>
    </div>
  </div>

  <!-- ЭКРАН 2: ГЛАВНЫЙ ИНТЕРФЕЙС -->
  <div id="app-screen" class="app-container hidden">
    
    <aside class="sidebar">
      <div class="logo">NEON // HUB</div>
      <nav class="nav-menu">
        <button class="nav-btn active" onclick="loadModule('feed', this)">Лента</button>
        <button class="nav-btn" onclick="loadModule('messenger', this)">Мессенджер</button>
        <button class="nav-btn" onclick="loadModule('profile', this)">Профиль</button>
        <button class="nav-btn" onclick="loadModule('library', this)">Библиотека</button>
        <button class="nav-btn" onclick="loadModule('reels', this)">Рилсы</button>
      </nav>
      <button class="logout-btn" onclick="handleLogout()">Выйти</button>
    </aside>

    <main class="main-content" id="module-container">
      <!-- Сюда подгружаются модули -->
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
