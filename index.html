<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Turbo Drift — Retro Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0c14;
            --panel-bg: rgba(18, 22, 36, 0.9);
            --accent: #38bdf8;
            --border: rgba(255, 255, 255, 0.12);
            --text: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header {
            height: 56px; background: var(--panel-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 10;
        }
        .logo { font-size: 1.2rem; font-weight: 900; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .room-badge { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; color: #38bdf8; font-weight: 700; transition: 0.2s; }
        .room-badge:hover { background: rgba(56, 189, 248, 0.3); }

        .workspace { flex: 1; display: flex; position: relative; }
        .canvas-container { flex: 1; position: relative; background: #05070d; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        canvas { background: #0b0e17; border-radius: 12px; box-shadow: 0 0 40px rgba(0,0,0,0.8); border: 1px solid var(--border); }

        .sidebar { width: 280px; background: var(--panel-bg); backdrop-filter: blur(12px); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 5; }
        .panel-header { padding: 14px 16px; font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid var(--border); color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
        .players-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .player-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(255, 255, 255, 0.03); border-radius: 8px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05); }
        .car-tag { width: 12px; height: 12px; border-radius: 3px; }

        .chat-section { flex: 1; display: flex; flex-direction: column; border-top: 1px solid var(--border); }
        .messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .msg { background: rgba(255, 255, 255, 0.03); padding: 8px 10px; border-radius: 6px; line-height: 1.4; }
        .msg .author { font-weight: 700; color: var(--accent); margin-bottom: 2px; }
        .chat-input { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: #fff; outline: none; font-size: 0.85rem; }
        .btn-send { background: var(--accent); border: none; color: #000; padding: 0 14px; border-radius: 8px; cursor: pointer; font-weight: 800; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-card { background: var(--panel-bg); border: 1px solid var(--border); padding: 32px; border-radius: 16px; width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .modal-card h2 { margin-bottom: 6px; font-size: 1.5rem; font-weight: 900; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal-card p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; }
        
        .car-select { display: flex; gap: 10px; margin-bottom: 20px; }
        .car-option { flex: 1; padding: 12px 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: 0.2s; text-align: center; }
        .car-option.selected { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
        .car-option h4 { font-size: 0.85rem; margin-bottom: 4px; }
        .car-option p { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0; }

        .color-picker { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-dot.selected { border-color: #fff; transform: scale(1.15); }

        .modal-card input[type="text"] { width: 100%; margin-bottom: 20px; text-align: center; font-size: 0.95rem; }
        .btn-main { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 10px; color: #000; font-weight: 900; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-main:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .controls-hint { position: absolute; bottom: 16px; left: 16px; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 8px; font-size: 0.75rem; color: var(--text-dim); border: 1px solid var(--border); pointer-events: none; }
    </style>
</head>
<body>

    <div class="modal" id="loginModal">
        <div class="modal-card">
            <h2>NEON TURBO DRIFT</h2>
            <p>Выбери тачку, цвет и введи никнейм</p>

            <div class="car-select">
                <div class="car-option selected" onclick="selectCar('speed', this)">
                    <h4>🏎️ Спорткар</h4>
                    <p>Макс. скорость</p>
                </div>
                <div class="car-option" onclick="selectCar('drift', this)">
                    <h4>🛞 Дрифт-кар</h4>
                    <p>Лёгкий занос</p>
                </div>
                <div class="car-option" onclick="selectCar('tank', this)">
                    <h4>Универсал</h4>
                    <p>Устойчивость</p>
                </div>
            </div>

            <div class="color-picker">
                <div class="color-dot selected" style="background: #f43f5e;" onclick="selectColor('#f43f5e', this)"></div>
                <div class="color-dot" style="background: #38bdf8;" onclick="selectColor('#38bdf8', this)"></div>
                <div class="color-dot" style="background: #10b981;" onclick="selectColor('#10b981', this)"></div>
                <div class="color-dot" style="background: #facc15;" onclick="selectColor('#facc15', this)"></div>
                <div class="color-dot" style="background: #a855f7;" onclick="selectColor('#a855f7', this)"></div>
            </div>

            <input type="text" id="usernameInput" placeholder="Твой никнейм..." maxlength="12">
            <button class="btn-main" onclick="joinGame()">НА СТАРТ!</button>
        </div>
    </div>

    <header>
        <div class="logo">NEON TURBO DRIFT 🏁</div>
        <div class="room-badge" id="roomBadge" onclick="copyLink()">Комната: Загрузка...</div>
    </header>

    <div class="workspace">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="960" height="640"></canvas>
            <div class="controls-hint">Управление: Стрелочки / WASD (Газ, Тормоз, Повороты) | Пробел / Shift — Занос / Нитро</div>
        </div>

        <div class="sidebar">
            <div class="panel-header">Гонщики (<span id="onlineCount">0</span>)</div>
            <div class="players-list" id="playersList"></div>

            <div class="chat-section">
                <div class="panel-header">Чат гонки</div>
                <div class="messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="msgInput" placeholder="Сообщение...">
                    <button class="btn-send" onclick="sendMsg()">></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ВСТАВЬ СВОЮ ССЫЛКУ С RENDER СЮДА:
        const SERVER_URL = "https://game-zaam.onrender.com";

        let socket;
        let nickname = "";
        let selectedCarType = "speed";
        let selectedColor = "#f43f5e";
        let allPlayers = {};
        let tireTracks = []; // Следы от шин при заносе

        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        if (!roomId) {
            roomId = Math.random().toString(36).substring(2, 8);
            window.history.replaceState({}, '', `?room=${roomId}`);
        }
        document.getElementById('roomBadge').innerText = `Комната: ${roomId} (Копировать)`;

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Ссылка скопирована! Отправь её другу.');
        }

        function selectCar(type, el) {
            selectedCarType = type;
            document.querySelectorAll('.car-option').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function selectColor(color, el) {
            selectedColor = color;
            document.querySelectorAll('.color-dot').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Характеристики нашей машины
        let myCar = {
            x: 350,
            y: 720,
            angle: -Math.PI / 2,
            speed: 0,
            maxSpeed: 6.5,
            accel: 0.18,
            friction: 0.97,
            turnSpeed: 0.045,
            drifting: false
        };

        let keys = {};
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        function joinGame() {
            const input = document.getElementById('usernameInput');
            if (!input.value.trim()) return;
            nickname = input.value.trim();
            document.getElementById('loginModal').style.display = 'none';

            if (selectedCarType === 'drift') { myCar.turnSpeed = 0.06; myCar.maxSpeed = 6.0; }
            if (selectedCarType === 'tank') { myCar.accel = 0.22; myCar.maxSpeed = 5.8; }

            socket = io(SERVER_URL);

            socket.on('connect', () => {
                socket.emit('join_room', { roomId, username: nickname, carType: selectedCarType, color: selectedColor });
            });

            socket.on('update_players', (players) => {
                allPlayers = players;
                const list = document.getElementById('playersList');
                const keysArr = Object.keys(players);
                document.getElementById('onlineCount').innerText = keysArr.length;
                list.innerHTML = '';

                keysArr.forEach(id => {
                    let p = players[id];
                    list.innerHTML += `
                        <div class="player-card">
                            <div class="car-tag" style="background: ${p.color}"></div>
                            <span><b>${p.name}</b></span>
                        </div>
                    `;
                });
            });

            socket.on('chat_message', (data) => {
                const box = document.getElementById('chatMessages');
                box.innerHTML += `<div class="msg"><div class="author">${data.user}</div><div>${data.text}</div></div>`;
                box.scrollTop = box.scrollHeight;
            });

            requestAnimationFrame(gameLoop);
        }

        function updatePhysics() {
            // Газ / Тормоз
            if (keys['ArrowUp'] || keys['KeyW']) myCar.speed += myCar.accel;
            if (keys['ArrowDown'] || keys['KeyS']) myCar.speed -= myCar.accel * 0.6;

            myCar.speed *= myCar.friction;

            // Нитро / Занос на Пробел или Shift
            let isNitro = keys['Space'] || keys['ShiftLeft'];
            let currentMaxSpeed = isNitro ? myCar.maxSpeed * 1.3 : myCar.maxSpeed;

            if (myCar.speed > currentMaxSpeed) myCar.speed = currentMaxSpeed;
            if (myCar.speed < -myCar.maxSpeed / 2) myCar.speed = -myCar.maxSpeed / 2;

            // Руль
            if (Math.abs(myCar.speed) > 0.2) {
                let turnMult = myCar.speed > 0 ? 1 : -1;
                if (keys['ArrowLeft'] || keys['KeyA']) myCar.angle -= myCar.turnSpeed * turnMult;
                if (keys['ArrowRight'] || keys['KeyD']) myCar.angle += myCar.turnSpeed * turnMult;
            }

            // Дрифт при резком повороте на высокой скорости
            myCar.drifting = isNitro && Math.abs(myCar.speed) > 3;

            myCar.x += Math.cos(myCar.angle) * myCar.speed;
            myCar.y += Math.sin(myCar.angle) * myCar.speed;

            // Оставляем следы от шин
            if (myCar.drifting || (Math.abs(myCar.speed) > 4 && (keys['ArrowLeft'] || keys['ArrowRight'] || keys['KeyA'] || keys['KeyD']))) {
                tireTracks.push({ x: myCar.x, y: myCar.y, alpha: 0.6 });
                if (tireTracks.length > 150) tireTracks.shift();
            }

            // Отправка данных на сервер
            if (socket && socket.connected) {
                socket.emit('player_drive', {
                    x: myCar.x,
                    y: myCar.y,
                    angle: myCar.angle,
                    speed: myCar.speed,
                    drifting: myCar.drifting
                });
            }
        }

        function drawTrack() {
            // Трасса с закруглениями и поребриками
            ctx.fillStyle = '#0b0e17';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Внешнее кольцо трассы
            ctx.beginPath();
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 140;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.strokeRect(120, 100, 720, 440);

            // Асфальтовое покрытие
            ctx.beginPath();
            ctx.strokeStyle = '#181b26';
            ctx.lineWidth = 130;
            ctx.strokeRect(120, 100, 720, 440);

            // Разметка трассы (пунктир)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            ctx.strokeRect(120, 100, 720, 440);
            ctx.setLineDash([]);

            // Линия старта
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(350, 505, 10, 130);
            ctx.fillStyle = '#000000';
            ctx.fillRect(355, 505, 5, 130);
        }

        function drawTireTracks() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            tireTracks.forEach((track, i) => {
                ctx.beginPath();
                ctx.arc(track.x, track.y, 4, 0, Math.PI * 2);
                ctx.fill();
                track.alpha -= 0.002;
            });
            tireTracks = tireTracks.filter(t => t.alpha > 0);
        }

        function drawCar(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);

            // Тень машинки
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(-14, -8, 32, 20);

            // Корпус
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = p.drifting ? 15 : 6;
            ctx.fillRect(-16, -10, 32, 20);

            // Стекла
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-2, -8, 12, 16);

            // Фары передние
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 8;
            ctx.fillRect(14, -9, 3, 4);
            ctx.fillRect(14, 5, 3, 4);

            // Стоп-сигналы
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.fillRect(-17, -8, 2, 4);
            ctx.fillRect(-17, 4, 2, 4);

            ctx.restore();

            // Никнейм над машиной
            ctx.fillStyle = '#f3f4f6';
            ctx.font = '700 12px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(p.name, p.x, p.y - 20);
        }

        function draw() {
            drawTrack();
            drawTireTracks();

            // Отрисовка всех игроков
            for (let id in allPlayers) {
                let p = allPlayers[id];
                drawCar(p);
            }
        }

        function gameLoop() {
            updatePhysics();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            if (input.value.trim() && socket) {
                socket.emit('chat_message', input.value.trim());
                input.value = '';
            }
        }
    </script>
</body>
</html>
