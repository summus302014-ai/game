<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Street Arena — Retro Fighter</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #090a0f;
            --panel: #131620;
            --accent: #f43f5e;
            --text: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Press Start 2P', monospace; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #1a1c29;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas { display: block; background: linear-gradient(to bottom, #0f172a, #1e1b4b); }

        /* HUD (Интерфейс здоровья) */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .fighter-hud {
            width: 340px;
        }

        .name-tag { font-size: 10px; margin-bottom: 6px; color: #38bdf8; }
        .hp-bar-bg { width: 100%; height: 20px; background: #334155; border: 2px solid #fff; border-radius: 4px; overflow: hidden; }
        .hp-bar-fill { width: 100%; height: 100%; background: #10b981; transition: width 0.2s; }
        .hp-bar-fill.right { background: #f43f5e; }

        .vs-badge { font-size: 14px; color: #facc15; text-shadow: 0 0 10px #facc15; }

        /* Модальное окно */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background: var(--panel);
            border: 2px solid #38bdf8;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 400px;
            box-shadow: 0 0 20px rgba(56,189,248,0.2);
        }

        .modal-card h2 { font-size: 16px; margin-bottom: 15px; color: #38bdf8; }
        .modal-card p { font-size: 8px; color: #94a3b8; margin-bottom: 20px; line-height: 1.6; }
        .modal-card input {
            width: 100%; padding: 12px; background: #000; border: 2px solid #334155;
            color: #fff; font-family: 'Press Start 2P', monospace; font-size: 10px; text-align: center; margin-bottom: 15px; outline: none;
        }
        .modal-card input:focus { border-color: #38bdf8; }

        .btn {
            width: 100%; padding: 12px; background: #38bdf8; border: none; color: #000;
            font-family: 'Press Start 2P', monospace; font-size: 10px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { background: #7dd3fc; box-shadow: 0 0 10px #38bdf8; }

        .controls-hint {
            margin-top: 15px; font-size: 8px; color: #64748b; text-align: center; line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="modal" id="loginModal">
        <div class="modal-card">
            <h2>NEON STREET ARENA</h2>
            <p>Управление:<br>A/D — Ходьба<br>W — Прыжок<br>J — Удар рукой<br>K — Удар ногой</p>
            <input type="text" id="usernameInput" placeholder="Твой ник..." maxlength="10">
            <button class="btn" onclick="joinGame()">В БОЙ!</button>
        </div>
    </div>

    <div class="game-container">
        <div class="hud">
            <div class="fighter-hud">
                <div class="name-tag" id="p1Name">Игрок 1</div>
                <div class="hp-bar-bg"><div class="hp-bar-fill" id="p1Hp" style="width: 100%;"></div></div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="fighter-hud" style="text-align: right;">
                <div class="name-tag" id="p2Name">Ожидание...</div>
                <div class="hp-bar-bg"><div class="hp-bar-fill right" id="p2Hp" style="width: 100%;"></div></div>
            </div>
        </div>

        <canvas id="fightCanvas" width="800" height="500"></canvas>
    </div>

    <div class="controls-hint">Ссылка на комнату вверху страницы — скинь другу для дуэли!</div>

    <script>
        // ВСТАВЬ СВОЮ ССЫЛКУ С RENDER СЮДА:
        const SERVER_URL = "https://game-zaam.onrender.com";

        let socket;
        let nickname = "";
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        if (!roomId) {
            roomId = Math.random().toString(36).substring(2, 8);
            window.history.replaceState({}, '', `?room=${roomId}`);
        }

        const canvas = document.getElementById('fightCanvas');
        const ctx = canvas.getContext('2d');

        let myData = { x: 150, y: 350, vx: 0, vy: 0, state: 'idle' };
        let allPlayers = {};
        let keys = {};

        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        function joinGame() {
            const input = document.getElementById('usernameInput');
            if (!input.value.trim()) return;
            nickname = input.value.trim();
            document.getElementById('loginModal').style.display = 'none';

            socket = io(SERVER_URL);

            socket.on('connect', () => {
                socket.emit('join_room', { roomId, username: nickname });
            });

            socket.on('room_full', () => {
                alert('Комната заполнена! Попробуй зайти по другой ссылке.');
                window.location.reload();
            });

            socket.on('update_game', (players) => {
                allPlayers = players;
                
                // Обновляем шкалы здоровья в HUD
                for (let id in players) {
                    let p = players[id];
                    if (p.side === 'left') {
                        document.getElementById('p1Name').innerText = p.name;
                        document.getElementById('p1Hp').style.width = p.hp + '%';
                    } else {
                        document.getElementById('p2Name').innerText = p.name;
                        document.getElementById('p2Hp').style.width = p.hp + '%';
                    }
                }
            });

            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (!socket) return;

            // Простое управление физикой бойца
            if (keys['KeyA'] || keys['ArrowLeft']) {
                myData.x -= 4;
                myData.state = 'walk';
            } else if (keys['KeyD'] || keys['ArrowRight']) {
                myData.x += 4;
                myData.state = 'walk';
            } else {
                myData.state = 'idle';
            }

            // Прыжок
            if ((keys['KeyW'] || keys['ArrowUp']) && myData.y >= 350) {
                myData.vy = -12;
            }

            myData.vy += 0.6; // гравитация
            myData.y += myData.vy;
            if (myData.y > 350) {
                myData.y = 350;
                myData.vy = 0;
            }

            // Границы экрана
            if (myData.x < 50) myData.x = 50;
            if (myData.x > 750) myData.x = 750;

            let action = null;
            if (keys['KeyJ']) action = 'punch';
            if (keys['KeyK']) action = 'kick';

            socket.emit('player_action', {
                x: myData.x,
                y: myData.y,
                state: action ? action : myData.state,
                action: action
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем фон (киберпанк-улица с неоновыми полосами)
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, 380);
            
            // Земля
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 380, canvas.width, 120);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, 380, canvas.width, 4);

            // Рисуем всех бойцов
            for (let id in allPlayers) {
                let p = allPlayers[id];
                
                ctx.save();
                ctx.translate(p.x, p.y);

                // Тело бойца (стилизованный ретро-робот/боец)
                ctx.fillStyle = p.side === 'left' ? '#38bdf8' : '#f43f5e';
                ctx.shadowColor = p.side === 'left' ? '#38bdf8' : '#f43f5e';
                ctx.shadowBlur = 15;

                // Туловище
                ctx.fillRect(-15, -60, 30, 45);
                // Голова
                ctx.fillRect(-10, -80, 20, 20);

                // Анимация удара или движения
                if (p.state === 'punch') {
                    ctx.fillRect(p.side === 'left' ? 15 : -35, -50, 25, 10); // кулак
                } else if (p.state === 'kick') {
                    ctx.fillRect(p.side === 'left' ? 15 : -35, -20, 30, 10); // нога
                }

                ctx.restore();

                // Никнейм над бойцом
                ctx.fillStyle = '#fff';
                ctx.font = '8px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x, p.y - 95);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
