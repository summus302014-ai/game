<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Совместная Рисовальня - Supabase DB</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #login-screen {
            position: absolute;
            background: rgba(30, 41, 59, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #475569;
            z-index: 10;
        }
        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #64748b;
            background: #0f172a;
            color: #fff;
            margin-bottom: 15px;
            width: 220px;
            outline: none;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #ec4899;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #db2777; }
        #app {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background: #ffffff;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.3);
            border-radius: 12px;
            cursor: crosshair;
        }
        .toolbar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
        }
        #clear-btn {
            background: #64748b;
            padding: 8px 16px;
            font-size: 14px;
        }
        #clear-btn:hover { background: #475569; }
    </style>
    <!-- Подключаем клиент Supabase -->
    <script src="https://cdn.jsdelivr.com/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="login-screen">
        <h2>Совместная Рисовальня</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Через базу данных Supabase!</p>
        <input type="text" id="username" placeholder="Твое имя..." maxlength="12"><br>
        <button id="join-btn">Войти в холст</button>
    </div>

    <div id="app">
        <div class="toolbar">
            <span>Цвет:</span>
            <div class="color-btn" style="background: #000000;" onclick="setColor('#000000')"></div>
            <div class="color-btn" style="background: #ef4444;" onclick="setColor('#ef4444')"></div>
            <div class="color-btn" style="background: #3b82f6;" onclick="setColor('#3b82f6')"></div>
            <div class="color-btn" style="background: #10b981;" onclick="setColor('#10b981')"></div>
            <div class="color-btn" style="background: #ec4899;" onclick="setColor('#ec4899')"></div>
            <button id="clear-btn" onclick="clearCanvas()">Очистить холст</button>
        </div>
        <canvas id="paintCanvas" width="800" height="500"></canvas>
    </div>

<script>
    // ВСТАВЬ СВОИ ДАННЫЕ ИЗ SUPABASE СЮДА:
    const SUPABASE_URL = 'https://rytfzqktytcjsytkxrqn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_31LjSxs-D3hhNVnFFNTAhA_NKeQhXKk';

    let supabaseClient = null;
    try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {
        console.error("Ошибка Supabase!");
    }

    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    
    let isDrawing = false;
    let currentColor = '#000000';

    document.getElementById('join-btn').onclick = () => {
        const val = document.getElementById('username').value.trim();
        if(!val) return alert('Введите имя!');

        if (SUPABASE_URL.includes('YOUR_')) {
            alert('Не забудь вставить ключи Supabase в код!');
        }

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';

        initDatabaseSync();
    };

    function setColor(color) {
        currentColor = color;
    }

    canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        drawPoint(e.offsetX, e.offsetY, currentColor, false);
        saveToDb(e.offsetX, e.offsetY, currentColor, 'start');
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        drawPoint(e.offsetX, e.offsetY, currentColor, true);
        saveToDb(e.offsetX, e.offsetY, currentColor, 'draw');
    });

    window.addEventListener('mouseup', () => {
        isDrawing = false;
    });

    function drawPoint(x, y, color, isMoving) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        if (!isMoving) {
            ctx.beginPath();
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
            ctx.stroke();
        }
    }

    // Подписываемся на изменения в таблице game_state
    function initDatabaseSync() {
        if (!supabaseClient) return;

        // Слушаем изменения в таблице game_state
        supabaseClient
            .channel('table-db-changes')
            .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: 'game_state' },
                (payload) => {
                    const row = payload.new;
                    if (row && row.data) {
                        const d = row.data;
                        if (d.action === 'clear') {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                        } else {
                            drawPoint(d.x, d.y, d.color, d.action === 'draw');
                        }
                    }
                }
            )
            .subscribe();
    }

    // Сохраняем действие в ту самую таблицу game_state (id у нас всегда 'main_room')
    async function saveToDb(x, y, color, action) {
        if (!supabaseClient) return;
        
        await supabaseClient
            .from('game_state')
            .upsert({ 
                id: 'main_room', 
                data: { x, y, color, action, time: Date.now() } 
            });
    }

    async function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!supabaseClient) return;

        await supabaseClient
            .from('game_state')
            .upsert({ 
                id: 'main_room', 
                data: { action: 'clear', time: Date.now() } 
            });
    }
</script>
</body>
</html>
